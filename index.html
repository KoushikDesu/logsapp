<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LogsApp — Web Chat</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='%230d52ce'/><circle cx='11' cy='11' r='4' fill='white'/><path d='M4 23C4 19.6863 7.13401 17 11 17C14.866 17 18 19.6863 18 23' fill='white' fill-opacity='0.95'/><circle cx='21' cy='13' r='3.5' fill='%23f59e0b'/><path d='M15 25C15 22.2386 17.6863 20 21 20C24.3137 20 27 22.2386 27 25' fill='%23f59e0b' fill-opacity='0.95'/></svg>" />
  
  <!-- SmartPrep Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Clean SmartPrep CSS -->
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="bg-[#0b0f19] text-[#f8fafc] font-sans antialiased overflow-hidden select-none m-0 p-0" style="height: 100dvh; min-height: 100dvh;">
  <div id="app" class="h-[100dvh] w-screen flex flex-col overflow-hidden"></div>

  <!-- Dedicated Isolated Call Overlay Container (Zero UI glitching) -->
  <div id="call-container" class="pointer-events-none fixed inset-0 z-50"></div>

  <!-- WebRTC Remote Audio Stream Player (Active DOM node) -->
  <audio id="remote-audio" autoplay playsinline style="position:fixed; top:-1000px; left:-1000px; width:1px; height:1px; opacity:0; pointer-events:none;"></audio>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" style="bottom: max(1.25rem, env(safe-area-inset-bottom));"></div>

  <!-- App Script (Pure JavaScript, Zero-Build) -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
